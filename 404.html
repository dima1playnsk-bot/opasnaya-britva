<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <base href="/opasnaya-britva/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена · Опасная бритва</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=4.0">
  <style>
    .nf { min-height: calc(100svh - 20px); display: grid; place-items: center; text-align: center; padding: 32px 16px; }
    .nf__code { font: 700 clamp(96px, 20vw, 180px)/1 var(--serif); color: var(--gold); }
    .nf h1 { font: 600 clamp(30px, 5vw, 44px)/1.1 var(--serif); margin: 8px 0 14px; }
    .nf p { color: var(--muted); max-width: 40ch; margin: 0 auto 28px; }
    .nf__actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="pole" aria-hidden="true"></div>
  <main class="nf">
    <div>
      <p class="nf__code">404</p>
      <h1>Здесь подстригли лишнее</h1>
      <p>Такой страницы нет. Зато у мастеров барбершопа есть свободное время: записаться можно онлайн за минуту.</p>
      <div class="nf__actions">
        <a class="btn btn--gold" href="./?book">Записаться онлайн</a>
        <a class="btn btn--ghost" href="./">На главную</a>
      </div>
    </div>
  </main>
</body>
</html>
